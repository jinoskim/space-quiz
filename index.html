<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주 탐험 퀴즈</title>
<style>
  :root {
    --bg1: #0b1030; --bg2: #2a1458; --card: #141a45; --text: #f4f6ff;
    --muted: #b9c0f0; --accent: #ffd34d; --ok: #3ddc97; --bad: #ff5c7a; --focus: #7cf3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--text); display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    overflow-x: hidden;
  }
  .stars, .stars::before, .stars::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 120px 80px, #cfe, transparent),
      radial-gradient(2px 2px at 220px 150px, #fff, transparent),
      radial-gradient(1px 1px at 300px 40px, #fed, transparent);
    background-size: 340px 200px; animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars::before { background-size: 260px 240px; animation-delay: 1s; opacity: .7; }
  .stars::after { background-size: 410px 300px; animation-delay: 2s; opacity: .5; }
  @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

  main {
    position: relative; z-index: 1; width: 100%; max-width: 640px; background: var(--card);
    border: 1px solid #3a4390; border-radius: 20px; padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
  .score { background: #232b6b; padding: 4px 12px; border-radius: 999px; color: var(--accent); }
  .score.bump { animation: bump .4s; }
  @keyframes bump { 50% { transform: scale(1.3); } }
  .bar { height: 12px; background: #232b6b; border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #7cf3ff, var(--accent)); transition: width .4s; }
  .emoji { font-size: 3rem; text-align: center; }
  h2 { font-size: 1.3rem; margin: 8px 0 16px; line-height: 1.4; }
  .options { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .opt {
    width: 100%; text-align: left; padding: 14px 16px; border-radius: 12px;
    background: #1d2560; border: 2px solid #3a4390;
    transition: transform .18s ease, background-color .4s ease, border-color .4s ease, box-shadow .18s ease;
  }
  .opt:hover:not(:disabled) { transform: translateX(4px); background: #27318a; }
  .opt:active:not(:disabled) { transform: translateY(2px) scale(.985); box-shadow: inset 0 2px 5px rgba(0,0,0,.3); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: #14684a; border-color: var(--ok); animation: pop .5s; }
  .opt.wrong { background: #6d1c33; border-color: var(--bad); animation: shake .4s; }
  @keyframes pop { 40% { transform: scale(1.04); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .opt:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; box-shadow: 0 0 0 2px var(--card), 0 0 0 6px rgba(124,243,255,.32); }
  .feedback { min-height: 3em; margin: 14px 0 0; font-weight: 600; }
  .next, .restart {
    margin-top: 12px; padding: 12px 24px; border: 0; border-radius: 999px; font-weight: 700;
    background: var(--accent); color: #1a1a1a;
  }
  .next:hover, .restart:hover { filter: brightness(1.1); }
  .hidden { display: none; }
  .result { text-align: center; }
  .result .big { font-size: 3.5rem; margin: 0; }
  .rocket { display: inline-block; font-size: 4rem; animation: fly 2s ease-in-out infinite; }
  @keyframes fly { 50% { transform: translateY(-14px) rotate(8deg); } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main>
  <h1>🚀 우주 탐험 퀴즈</h1>
  <p class="sub">10문항으로 우주 지식을 시험해 보세요. 키보드 1~4 키로도 선택할 수 있어요.</p>

  <section id="quiz">
    <div class="top">
      <span id="count" aria-live="polite">1 / 10</span>
      <span class="score" id="score">점수 0</span>
    </div>
    <div class="bar" role="progressbar" aria-label="진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div id="fill"></div></div>
    <div class="emoji" id="emoji" aria-hidden="true"></div>
    <h2 id="question" tabindex="-1"></h2>
    <ul class="options" id="options"></ul>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <button class="next hidden" id="next">다음 문제 →</button>
  </section>

  <section id="result" class="result hidden" aria-live="polite">
    <div class="rocket" aria-hidden="true">🚀</div>
    <h2 id="rank" tabindex="-1"></h2>
    <p class="big" id="final"></p>
    <p id="msg"></p>
    <button class="restart" id="restart">다시 도전하기</button>
  </section>
</main>

<script>
const Q = [
  { e: "☀️", q: "태양계에서 가장 큰 행성은?", o: ["지구", "목성", "토성", "해왕성"], a: 1, x: "목성은 지구 1,300개 이상이 들어갈 만큼 커요." },
  { e: "🔴", q: "'붉은 행성'이라 불리는 행성은?", o: ["금성", "수성", "화성", "천왕성"], a: 2, x: "화성 표면의 산화철(녹) 때문에 붉게 보여요." },
  { e: "🌕", q: "인류가 처음 달에 착륙한 우주선은?", o: ["아폴로 11호", "보이저 1호", "소유즈", "스푸트니크"], a: 0, x: "1969년 닐 암스트롱이 첫 발을 디뎠어요." },
  { e: "🪐", q: "토성의 가장 유명한 특징은?", o: ["거대한 붉은 점", "아름다운 고리", "역행 자전", "얼음 화산"], a: 1, x: "토성의 고리는 얼음과 바위 조각으로 이루어져 있어요." },
  { e: "💡", q: "태양빛이 지구에 도달하는 데 걸리는 시간은 약?", o: ["8분", "1초", "1시간", "1일"], a: 0, x: "약 8분 20초가 걸려요." },
  { e: "🌌", q: "우리 은하의 이름은?", o: ["안드로메다", "마젤란", "은하수(밀키웨이)", "삼각형자리"], a: 2, x: "태양계는 은하수의 나선 팔에 위치해요." },
  { e: "🕳️", q: "빛조차 빠져나올 수 없는 천체는?", o: ["퀘이사", "블랙홀", "펄서", "혜성"], a: 1, x: "강한 중력 때문에 사건의 지평선 안에서는 탈출할 수 없어요." },
  { e: "👩‍🚀", q: "국제우주정거장(ISS)은 지구 주위를 하루에 약 몇 바퀴 돌까?", o: ["1바퀴", "5바퀴", "16바퀴", "100바퀴"], a: 2, x: "약 90분에 한 바퀴, 하루에 약 16번 돌아요." },
  { e: "☄️", q: "76년 주기로 지구에 접근하는 유명한 혜성은?", o: ["헤일-밥", "핼리 혜성", "슈메이커-레비", "해왕성 혜성"], a: 1, x: "다음 핼리 혜성은 2061년에 돌아와요." },
  { e: "🌍", q: "태양계에서 태양과 가장 가까운 행성은?", o: ["수성", "금성", "지구", "화성"], a: 0, x: "수성은 태양과 평균 약 5,800만 km 떨어져 있어요." }
];

const $ = id => document.getElementById(id);
let i = 0, score = 0, locked = false;

function render() {
  const d = Q[i]; locked = false;
  $("count").textContent = `${i + 1} / ${Q.length}`;
  $("emoji").textContent = d.e;
  $("question").textContent = d.q;
  $("feedback").textContent = ""; $("feedback").style.color = "";
  $("next").classList.add("hidden");
  const bar = $("bar"), pct = (i / Q.length) * 100;
  $("fill").style.width = pct + "%"; bar.setAttribute("aria-valuenow", Math.round(pct));
  $("options").innerHTML = "";
  d.o.forEach((t, n) => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.className = "opt"; b.textContent = `${n + 1}. ${t}`;
    b.onclick = () => pick(n);
    li.appendChild(b); $("options").appendChild(li);
  });
  $("question").focus();
}

function pick(n) {
  if (locked) return; locked = true;
  const d = Q[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[d.a].classList.add("correct");
  const fb = $("feedback");
  if (n === d.a) {
    score++; $("score").textContent = `점수 ${score}`;
    $("score").classList.remove("bump"); void $("score").offsetWidth; $("score").classList.add("bump");
    fb.textContent = `✅ 정답입니다! ${d.x}`; fb.style.color = "var(--ok)";
  } else {
    btns[n].classList.add("wrong");
    fb.textContent = `❌ 오답입니다. 정답: ${d.o[d.a]}. ${d.x}`; fb.style.color = "var(--bad)";
  }
  const nx = $("next");
  nx.textContent = i === Q.length - 1 ? "결과 보기 🏁" : "다음 문제 →";
  nx.classList.remove("hidden"); nx.focus();
}

function finish() {
  $("fill").style.width = "100%"; $("bar").setAttribute("aria-valuenow", 100);
  $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  const r = score >= 9 ? ["🌟 우주 사령관", "완벽에 가까운 우주 전문가예요!"]
        : score >= 7 ? ["🧑‍🚀 베테랑 우주비행사", "훌륭해요! 조금만 더 하면 사령관이에요."]
        : score >= 4 ? ["🛰️ 견습 탐험가", "좋은 출발이에요. 다시 도전해 보세요!"]
        : ["🌠 우주 새내기", "우주는 넓고 배울 건 많아요. 다시 도전!"];
  $("rank").textContent = r[0]; $("msg").textContent = r[1];
  $("final").textContent = `${score} / ${Q.length}`;
  $("rank").focus();
}

$("next").onclick = () => { if (++i < Q.length) render(); else finish(); };
$("restart").onclick = () => {
  i = 0; score = 0; $("score").textContent = "점수 0";
  $("result").classList.add("hidden"); $("quiz").classList.remove("hidden"); render();
};
document.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "4" && !$("quiz").classList.contains("hidden")) {
    const n = +e.key - 1; if (n < Q[i].o.length) pick(n);
  }
});
render();
</script>
</body>
</html>
